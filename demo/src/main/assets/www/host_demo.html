<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCEF Host Demo</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #101418;
            color: #f0f0f0;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 16px 0;
        }

        .row {
            margin-bottom: 12px;
            padding: 12px;
            background-color: #1c2128;
            border-radius: 6px;
            word-break: break-word;
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
        }

        a {
            color: #7cb7ff;
        }
    </style>
</head>
<body>
    <h1>OpenCEF Host Demo</h1>

    <div class="row" id="runtime">Runtime ready: no</div>
    <div class="row" id="result">Host result: none yet</div>
    <div class="row" id="callbacks">Callbacks for last result: none yet</div>

    <p><button id="sendButton" disabled>Send host_test_event</button></p>
    <p><a href="host_demo_next.html">Open second page</a></p>

    <script>
        var sequence = 0;
        var callbackCounts = {};

        var runtimeElement = document.getElementById("runtime");
        var resultElement = document.getElementById("result");
        var callbacksElement = document.getElementById("callbacks");
        var sendButton = document.getElementById("sendButton");

        function whenCefReady(callback) {
            if (window.cef.isReady()) {
                callback();
            } else {
                setTimeout(function () {
                    whenCefReady(callback);
                }, 10);
            }
        }

        function sendTestEvent() {
            sequence += 1;
            window.cef.emit("host_test_event", JSON.stringify({
                sequence: sequence,
                text: "Hello from the page"
            }));
        }

        function onHostTestResult(payload) {
            var data = JSON.parse(payload);
            callbackCounts[data.sequence] = (callbackCounts[data.sequence] || 0) + 1;
            resultElement.textContent = "Host result: " + data.text + " (host event #" + data.hostEventCount + ")";
            callbacksElement.textContent = "Callbacks for sequence " + data.sequence + ": " + callbackCounts[data.sequence];
        }

        whenCefReady(function () {
            window.cef.on("host_test_result", onHostTestResult);
            sendButton.disabled = false;
            sendButton.addEventListener("click", sendTestEvent);
            runtimeElement.textContent = "Runtime ready: yes";
            window.cef.emit("host_page_ready", "{}");
            sendTestEvent();
        });
    </script>
</body>
</html>
